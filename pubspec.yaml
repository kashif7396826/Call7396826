name: calldrag_mobile
description: CallDrag mobile app — real calling, contacts, wallet and call history against the live CallDrag API (api.calldrag.com). No mock data anywhere in this app.
publish_to: "none"
version: 0.1.0+1

environment:
  # Raised from >=3.22.0/>=3.4.0 to match square_in_app_payments' real, current requirement
  # (the official Square plugin needs Flutter >=3.44.0 for its Swift Package Manager iOS
  # integration) — checked against the live pub.dev listing, not assumed. twilio_voice's own
  # floor (Flutter >=3.22.0) is comfortably below this, so raising it doesn't conflict.
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking — talks to the real Node backend (api.calldrag.com/api/v1), never a mock server.
  dio: ^5.11.1
  socket_io_client: ^3.1.6

  # Auth token storage — access/refresh tokens live here, never in plain SharedPreferences.
  flutter_secure_storage: ^11.2.0

  # State management.
  provider: ^6.1.5+1

  # Twilio Programmable Voice SDK wrapper — real outbound/inbound VoIP calling, no fake ringing.
  twilio_voice: ^0.5.0

  # Plays the real recording audio streamed from GET /calls/:id/recording (an authenticated,
  # proxied endpoint — never a raw provider URL) — see features/calls/recording_player.dart.
  just_audio: ^0.10.6

  # Official Square In-App Payments SDK plugin — real card tokenization for wallet top-up,
  # same PCI model as the website's Web Payments SDK (card numbers never reach this app's own
  # code, only Square's native card-entry UI and the resulting opaque nonce). Android
  # minSdkVersion 28 required — see README.md.
  square_in_app_payments: ^2.0.0

  # Firebase Cloud Messaging — how twilio_voice actually delivers an incoming-call notification
  # on Android (there is no other transport). Needs a real Firebase project this repo doesn't
  # (and can't) include — see README.md's "Inbound calling setup" for the one remaining manual
  # step. firebase_core must come before firebase_messaging in initialization order at runtime,
  # not in this file, but both are listed together since neither is useful without the other.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Formatting (phone numbers, currency, dates) shown throughout the app.
  intl: ^0.20.3

  # Detects real connectivity loss so the app can show "you're offline" instead of a confusing
  # network-error toast — never used to fabricate data while offline.
  connectivity_plus: ^7.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
